<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>To do App</h1>
        <p>Manage your daily tasks</p>
        <button id="theme-btn">Dark Mode</button>
    </header>

    <main>
        <section class="todo-list">
            <h2>Todo List</h2>

            <div id = "todo-container">
                <!-- Todo items will be showed here -->
            </div>
        </section>

        <section class="todo-detail">
            <div id="add-section">
                <h2>Add new Todo</h2>

                <form id="todo-form"> 
                    <label for="title">Todo Title</label> <input type="text" id="title" name="title" placeholder="Enter todo title" >
                    <label for="description">Description</label>
                    <textarea id="description" name="description" placeholder="Enter description"></textarea>

                    <button type="submit">Add Todo</button>
                </form>
            </div>

            <div id="edit-section" style="display: none;">
                <h2>Edit Todo</h2>

                <form id="edit-form">
                    <label for="edit-title">Todo Title</label>
                    <input type="text" id="edit-title" name="edit-title" placeholder="Enter todo title">
                    <label for="edit-description">Description</label>
                    <textarea id="edit-description" name="edit-description" placeholder="Enter description"></textarea>

                    <div class="edit-buttons">
                        <button type="submit">Save changes</button>
                        <button type="button" id="cancel-edit">Cancel</button>
                    </div>
                </form>
            </div>

        </section>

    </main>

    <footer>
        <p>&copy; My Task Manager App</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
